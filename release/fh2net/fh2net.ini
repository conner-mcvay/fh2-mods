; fh2net settings, read at game start (Azimuth's data\bin\fh2net.ini). See README.md.
[net]
ConnectivityLevel=4
FakeQos=1
FixStreams=1
RealSockets=1
FakeParty=1
FakeAssociation=1
SkipWeatherWait=1
SkipTrafficWait=1
; the game server (fh2srv's relay): the server PC's IP address. ::1 when the server runs on this PC.
ServerAddress=::1
ServerPort=5101
; this console's secure device address: any base64 text, different on every console
; (ZmgybmV0LWxvY2FsLWRldmljZS0x is "fh2net-local-device-1"; ...ZS0y is 2, ...ZS0z is 3)
LocalAddress=ZmgybmV0LWxvY2FsLWRldmljZS0x
[xbl]
FakeToken=1
; this console's Xbox user id, different on every console (Azimuth's own is 2533274790395904).
; The save follows it: Azimuth keeps it in data\titles\1A96545B\saves\player-1\User_<id in hex>,
; so with another id, copy your save folder User_9000000000000 to the new name (...905 = User_9000000000001).
Xuid=2533274790395904
; the name others see (empty: Azimuth's player name)
Gamertag=
[http]
; the server PC's web address. http://127.0.0.1:8090 when the server runs on this PC.
Server=http://127.0.0.1:8090
[input]
; a controller script file in data\bin (copy one from extras\), e.g. fh2net-idle.txt; empty: off
Script=
HideRealController=0
